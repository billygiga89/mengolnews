name: Deploy MengolNews

on:
  push:
    branches:
      - master

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish WASM
        run: dotnet publish MengolNews/MengolNews.csproj -c Release -o publish

      - name: Remove compressed files from functions (Cloudflare bundler fix)
        run: |
          find publish/wwwroot/functions -type f \( -name "*.br" -o -name "*.gz" \) -delete

      - name: Cache busting
        run: |
          VERSION=$(date +%s)
          sed -i "s/css\/app\.css/css\/app.css?v=$VERSION/" publish/wwwroot/index.html

      - name: Sanitize _routes.json (remove BOM e caracteres invisíveis)
        run: |
          echo "Primeiros bytes ANTES:"
          head -c 24 publish/wwwroot/_routes.json | xxd
          LC_ALL=C sed -i -e '1s/^\xEF\xBB\xBF//' -e 's/\xC2\xA0/ /g' -e 's/\xE2\x80\x8B//g' publish/wwwroot/_routes.json
          echo "Primeiros bytes DEPOIS:"
          head -c 24 publish/wwwroot/_routes.json | xxd

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: publish/wwwroot
          command: pages deploy . --project-name=mengolfla --branch=master
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
